name: Deploy to GitHub Pages

# ACHTUNG: GitHub Pages liefert nur statische Dateien - dort gibt es die
# Functions unter /api/ nicht. Eine dort veröffentlichte Kopie sieht
# funktionsfähig aus, kann sich aber nicht einmal anmelden. Deshalb läuft
# dieser Job nicht mehr automatisch bei jedem Push. Die echte Adresse ist
# die Vercel-URL.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
