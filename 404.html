<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — SONAR</title>
<style>
:root{--grn:#14f195;--mu:#8a8d9c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070a;color:#eceef3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.b::before{content:"";position:fixed;width:600px;height:600px;border-radius:50%;background:#9945ff;
  filter:blur(140px);opacity:.14;top:-240px;left:50%;transform:translateX(-50%)}
.c{position:relative;z-index:1}
h1{font-family:ui-monospace,Menlo,monospace;font-size:88px;letter-spacing:-.04em;color:var(--grn);margin-bottom:12px}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--mu);font-size:16px;margin-bottom:28px;max-width:400px;line-height:1.6}
a{display:inline-block;background:var(--grn);color:#04120c;font-weight:600;font-size:15px;
  padding:13px 26px;border-radius:11px;text-decoration:none}
a:hover{background:#3ff7ac}
</style>
</head>
<body class="b">
<div class="c">
  <h1>404</h1>
  <h2>Kein Signal auf dieser Frequenz.</h2>
  <p>Diese Seite gibt es nicht — oder sie wurde gerugged. Zurück zum Radar.</p>
  <a href="/">Zur Startseite</a>
</div>
</body>
</html>
